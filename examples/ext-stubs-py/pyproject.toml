[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mds-ext-stubs"
version = "0.1.0"
description = "Recognition-only stubs for machine-usable embed types in GitHub/GitLab Flavored Markdown; CSV ships a real minimal validator as the reference implementation."
license = { text = "MIT" }
dependencies = []

[project.entry-points."mds_ext"]
md-stubs = "mds_ext_stubs"

[tool.setuptools]
py-modules = ["mds_ext_stubs"]
