name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  javascript:
    name: JavaScript tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run JavaScript test suite
        run: npm test
        working-directory: js

  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e py
      - name: Run Python test suite
        run: python -m pytest py/tests -q

  package-and-install:
    name: Package and fresh-install smoke test
    runs-on: ubuntu-latest
    needs: [javascript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify npm package contents
        run: node tools/package-js.mjs
      - name: Build and verify Python distributions
        run: node tools/package-py.mjs
      - name: Install npm tarball in a fresh consumer directory
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" ./js
          package=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'mds-core-*.tgz' -print -quit)
          test -n "$package"
          npm install --prefix "$RUNNER_TEMP/npm-consumer" "$package"
          npx --prefix "$RUNNER_TEMP/npm-consumer" mds validate conformance/valid/composition/case.md conformance/valid/composition/case.mds
      - name: Install Python wheel in a fresh virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/python-consumer"
          "$RUNNER_TEMP/python-consumer/bin/python" -m pip install py/dist/*.whl
          "$RUNNER_TEMP/python-consumer/bin/mds" validate conformance/valid/composition/case.md conformance/valid/composition/case.mds
